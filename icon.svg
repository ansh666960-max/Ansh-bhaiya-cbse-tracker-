<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accent)" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Graduation cap & Target checkmark emblem -->
  <g filter="url(#shadow)">
    <!-- Shield / Badge background -->
    <path d="M256 95 L375 145 C375 250 325 330 256 375 C187 330 137 250 137 145 Z" fill="#1e293b" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Central '10' Badge and Checkmark -->
    <circle cx="256" cy="235" r="70" fill="url(#accent)" opacity="0.15" />
    <path d="M220 235 L245 260 L295 205" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Class 10 Stars -->
    <circle cx="205" cy="165" r="8" fill="#facc15" />
    <circle cx="256" cy="150" r="10" fill="#facc15" />
    <circle cx="307" cy="165" r="8" fill="#facc15" />
    
    <!-- Text / Banner: 2027 -->
    <rect x="186" y="305" width="140" height="34" rx="8" fill="#4f46e5" />
    <text x="256" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="2">CBSE 2027</text>
  </g>
  
  <!-- App initial banner -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#f8fafc" letter-spacing="1">ANSH BHAIYA</text>
</svg>
